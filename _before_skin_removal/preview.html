<style>
/* ============================================================
   DSHSkin 设计 token（与 panel.html 同一套）
   工具风：发丝线分隔 · 单一强调色 · 数字用等宽
   Light = 默认 / Dark = [data-mode="dark"]
   ============================================================ */
:root{
  --bg-app:#FAFAFA; --bg-surface:#FFFFFF; --bg-raised:#F5F5F5; --bg-hover:#F2F2F5;
  --border-default:#E0E0E5; --border-strong:#CFCFD6; --border-subtle:#EDEDF0;
  --text-primary:#17171C; --text-secondary:#52525C; --text-tertiary:#70707A; --text-disabled:#A1A1AB;
  --accent:#5E6BD1; --accent-hover:#5257C4; --accent-soft:#EDF0FA; --accent-text:#5257C4;
  --success:#1A8038; --success-soft:#E8F5ED;
  --danger:#C2382E; --danger-soft:#FAEDED;
  --warning:#996600; --warning-soft:#FFF8E6;
  --on-accent:#FFFFFF;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:10px;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; --sp6:24px;
  --mono:'JetBrains Mono','Cascadia Mono',Consolas,ui-monospace,monospace;
  --sans:'Inter','Noto Sans SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif;
  --hdr-h:48px;
}
[data-mode="dark"]{
  --bg-app:#0A0A0D; --bg-surface:#121217; --bg-raised:#1A1A1F; --bg-hover:#1F1F26;
  --border-default:#2B2B33; --border-strong:#3D3D45; --border-subtle:#212126;
  --text-primary:#F5F5F5; --text-secondary:#A1A1AB; --text-tertiary:#8C8C94; --text-disabled:#575761;
  --accent:#5E6BD1; --accent-hover:#6B78E3; --accent-soft:#1C1C33; --accent-text:#9CA3ED;
  --success:#40BA4F; --success-soft:#0F241A;
  --danger:#F26E6E; --danger-soft:#291417;
  --warning:#D19921; --warning-soft:#2A2110;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  font-size:12.5px;
  background:var(--bg-app);
  color:var(--text-primary);
  display:flex;flex-direction:column;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

/* ---------- 顶部栏 ---------- */
.topbar{
  display:flex;align-items:center;gap:var(--sp3);
  height:var(--hdr-h);padding:0 var(--sp5);
  background:var(--bg-surface);
  border-bottom:1px solid var(--border-default);
  flex:0 0 auto;
}
.back-link{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--text-secondary);text-decoration:none;
  padding:5px 10px;border-radius:var(--r-sm);
  border:1px solid var(--border-default);background:var(--bg-surface);
  cursor:pointer;transition:background .12s,color .12s;
}
.back-link:hover{background:var(--bg-hover);color:var(--text-primary)}
.topbar-brand{display:flex;align-items:center;gap:var(--sp2);padding-left:var(--sp2)}
.topbar-brand .mark{
  width:24px;height:24px;border-radius:var(--r-sm);
  background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
}
.topbar-brand b{font-size:12.5px;font-weight:600}
.topbar-brand span{font-size:10.5px;color:var(--text-tertiary);display:block;margin-top:1px}
.topbar-spacer{flex:1}
.theme-name{font-size:12.5px;font-weight:600}
.theme-version{
  font-family:var(--mono);font-size:10.5px;color:var(--text-tertiary);
  padding:2px 6px;border-radius:var(--r-xs);background:var(--bg-raised);
}
.btn{
  font-size:11.5px;color:var(--text-secondary);background:var(--bg-surface);
  border:1px solid var(--border-default);border-radius:var(--r-sm);
  padding:6px 13px;cursor:pointer;transition:background .12s,color .12s;
}
.btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.btn-solid{
  background:var(--accent);border-color:var(--accent);color:var(--on-accent);
  font-weight:500;
}
.btn-solid:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.btn-solid:disabled{opacity:.6;cursor:wait}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--bg-hover)}

/* 明暗分段控件 */
.seg{
  display:flex;align-items:center;gap:2px;background:var(--bg-raised);
  border-radius:var(--r-sm);padding:2px;
}
.seg button{
  border:none;background:transparent;cursor:pointer;
  font-size:11px;color:var(--text-tertiary);
  padding:4px 11px;border-radius:var(--r-xs);transition:all .12s;
}
.seg button:hover{color:var(--text-primary)}
.seg button.on{background:var(--bg-surface);color:var(--text-primary);font-weight:500}

/* ---------- 主体：单栏全宽预览 ---------- */
.layout{
  flex:1;display:grid;grid-template-columns:1fr;
  min-height:0;
}

/* ---------- 右侧预览区 ---------- */
.preview-pane{
  display:flex;flex-direction:column;gap:var(--sp3);
  padding:var(--sp5);overflow-y:auto;min-width:0;
}

/* 模拟器工具条（DSHSkin 外壳） */
.sim-controls{
  display:flex;gap:var(--sp4);flex-wrap:wrap;align-items:center;
  padding:var(--sp2) var(--sp3);
  background:var(--bg-surface);
  border:1px solid var(--border-default);
  border-radius:var(--r-md);
  width:fit-content;max-width:100%;
}
.sim-ctrl-group{display:flex;align-items:center;gap:3px}
.sim-ctrl-label{font-size:10.5px;color:var(--text-tertiary);margin-right:3px}
.sim-ctrl-btn{
  font-size:11px;border:1px solid transparent;background:transparent;
  color:var(--text-tertiary);border-radius:var(--r-xs);
  padding:4px 10px;cursor:pointer;transition:all .12s;
}
.sim-ctrl-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.sim-ctrl-btn.on{
  background:var(--accent-soft);border-color:transparent;
  color:var(--accent-text);font-weight:500;
}

/* 模拟器舞台 */
.sim-stage{
  display:flex;justify-content:center;
  padding:4px 0;
  border-radius:var(--r-lg);
  background:var(--bg-raised);
  border:1px solid var(--border-subtle);
}

/* 保真声明 */
.fidelity-note{
  display:flex;align-items:flex-start;gap:var(--sp2);
  padding:10px var(--sp3);
  background:var(--bg-surface);
  border:1px solid var(--border-default);
  border-left:2px solid var(--accent);
  border-radius:var(--r-sm);
  font-size:11px;color:var(--text-secondary);line-height:1.65;
}
.fidelity-note svg{width:14px;height:14px;flex:0 0 14px;margin-top:1px;color:var(--accent)}
.fidelity-note strong{color:var(--text-primary);font-weight:600}

/* toast */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:var(--text-primary);color:var(--bg-surface);
  font-size:12px;padding:9px 16px;border-radius:var(--r-sm);
  opacity:0;pointer-events:none;transition:all .2s ease;
  box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:99;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   保真窗口（.sim-window）变量声明
   这些值只作用于模拟器内部，代表「主题参数的默认着色」；
   真正生效的颜色由注入的主题 CSS 覆盖。
   ============================================================ */
.sim-window{
  --sim-tx-1:#e8eee9; --sim-tx-2:#9fb0a5; --sim-tx-3:#6f8279;
  --sim-accent:#6b8c61; --sim-accent-deep:#426b51;
  --sim-warn:#d9a657; --sim-warn-deep:#b98a3f;
  --sim-line:rgba(255,255,255,.10);
}

/* ===== 保真窗口：承载真实 DSH 面板快照的 iframe ===== */
  .sim-window {
    width: 100%;
    max-width: 1440px;
    min-height: 560px;
    height: calc(100vh - 150px);
    border-radius: 12px;

  .sim-sidebar.hidden { display: none; }

    font-size: 10.5px;

  }
  .sim-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

      <span data-page-node-id="awNjG6VdW6Pf7gUlxAbHhX"><strong data-page-node-id="JaMzm6jBV6ynYpF2PHKtjq">保真预览</strong> · 下方窗口是真实 DeepSeek Harness 面板快照（DOM 结构与 CSS 均取自运行实例，与真实应用完全一致），展示当前主题注入后的渲染效果，DSHSkin 仅注入主题变量着色，不改动其任何布局。</span>

        <button class="sim-ctrl-btn on" id="sim-mode-chat" onclick="simMode('chat')" data-page-node-id="Y94Y6EkA4YKG34pabZapiC">会话</button>

        <button class="sim-ctrl-btn on" id="sim-width-wide" onclick="simWidth('wide')" data-page-node-id="hm8ZJplijK6gSwKlG7ETdS">宽屏</button>

      <span class="sim-ctrl-group" data-page-node-id="eBnRsUk1yhns1cgGEYAMjr"><span class="sim-ctrl-label" data-page-node-id="g7Dti3dxnCFJgzfqGbhEZE">侧栏</span>

        <button class="sim-ctrl-btn on" id="sim-app-light" onclick="simAppearance('light')" data-page-node-id="tqfaVM8RoEhnH1deFQ3y0G">浅色</button>

<div class="toast" id="toast" data-page-node-id="IOgAGr4j2iXwwErJRTD2j5"></div>

<script>
  const API_BASE = location.protocol === 'file:' ? 'http://127.0.0.1:8765' : '';
  let themeId = new URLSearchParams(location.search).get('theme') || '';
  let themeAppearance = 'light';   // 主题自身形态（子帧回传）
  let simAppearanceMode = 'light'; // 预览器选择的外观
  let simCur = 'chat';
  let curVersion = '';

  // ===== 返回主题库（有历史则后退，否则回面板主题页）=====
  function goBack() {
    try { if (history.length > 1) { history.back(); return; } } catch (e) {}
    location.href = '/panel.html?view=themes';
  }

  // ===== 预览页自身的明暗模式（独立于模拟器的「外观」开关）=====
  function setUiMode(m) {
    document.documentElement.setAttribute('data-mode', m);
    const l = document.getElementById('ui-light');
    const d = document.getElementById('ui-dark');
    if (l) l.classList.toggle('on', m === 'light');
    if (d) d.classList.toggle('on', m === 'dark');
    try { localStorage.setItem('dshskin-ui-mode', m); } catch (e) {}
  }
  function initUiMode() {
    let m = 'light';
    try {
      const qs = new URLSearchParams(location.search).get('ui');
      m = qs || localStorage.getItem('dshskin-ui-mode') || 'light';
    } catch (e) {}
    setUiMode(m === 'dark' ? 'dark' : 'light');
  }

  // ===== 加载主题 =====
  async function load() {
    initUiMode();
    if (!themeId) { showToast('未指定主题'); return; }
    try {
      const themes = await (await fetch(`${API_BASE}/api/themes`)).json();
      const theme = (themes.themes || []).find(t => t.id === themeId);
      document.getElementById('theme-name').textContent = theme ? `「${theme.name}」` : themeId;
      curVersion = theme ? theme.version : '';
      themeAppearance = theme ? (theme.appearance || 'light') : 'light';
      document.getElementById('theme-version').textContent = curVersion ? `v${curVersion}` : '';
      // dark 主题恒暗：锁定外观开关为深色
      if (themeAppearance === 'dark') { simAppearanceMode = 'dark'; }
      syncAppearanceButtons();
      simMode(simCur);
    } catch (err) {
      showToast('加载失败: ' + err.message);
    }
  }

  function syncAppearanceButtons() {
    const l = document.getElementById('sim-app-light');
    const d = document.getElementById('sim-app-dark');
    if (l) l.classList.toggle('on', simAppearanceMode === 'light');
    if (d) d.classList.toggle('on', simAppearanceMode === 'dark');
    // 纯深色主题没有浅色变体：禁用浅色按钮，避免点了无反应造成困惑
    const fixedDark = themeAppearance === 'dark';
    if (l) {
      l.disabled = fixedDark;
      l.style.opacity = fixedDark ? '0.4' : '';
      l.title = fixedDark ? '该主题为纯深色，无浅色变体' : '';
    }
  }

  // 子帧回传主题自身形态（以子帧实际拉到的为准）
  window.addEventListener('message', function (ev) {
    if (ev.origin !== location.origin) return;
    const d = ev.data || {};
    if (d.type === 'dshskin:theme-appearance') {
      themeAppearance = d.appearance || 'light';
      if (themeAppearance === 'dark') {
        simAppearanceMode = 'dark';
        syncAppearanceButtons();
        postToFrame({ type: 'dshskin:appearance', appearance: 'dark' });
      }
    }
  });

  // ===== 真实面板预览：iframe + postMessage 驱动 =====
  function applyPreview() {
    if (!themeId) return;
    // 预览只呈现主题注入后的样子：成品 CSS 由子帧按主题自身参数拉取，这里只同步外观
    postToFrame({ type: 'dshskin:appearance', appearance: simAppearanceMode });
  }

  const SNAP_PAGES = { home: 'snap-home.html', chat: 'snap-conv.html', settings: 'snap-settings.html' };
  function snapBase() { return (API_BASE || location.origin) + '/assets/'; }
  function postToFrame(msg) {
    const f = document.getElementById('sim-frame');
    if (f && f.contentWindow) {
      // 指定精确 targetOrigin（iframe 与父页同源托管在 127.0.0.1），不再用通配 '*'
      let target = location.origin;
      try { target = new URL(f.src, location.href).origin || target; } catch (e) {}
      try { f.contentWindow.postMessage(msg, target); } catch (e) {}
    }
  }
  function simMode(mode) {
    const frame = document.getElementById('sim-frame');
    // 带 ?theme= 打开快照页：iframe 内部按该主题拉参数渲染，避免主题串台
    frame.src = snapBase() + (SNAP_PAGES[mode] || SNAP_PAGES.home) + '?theme=' + encodeURIComponent(themeId);
    document.getElementById('sim-mode-home').classList.toggle('on', mode === 'home');
    document.getElementById('sim-mode-chat').classList.toggle('on', mode === 'chat');
    document.getElementById('sim-mode-settings').classList.toggle('on', mode === 'settings');
    simCur = mode;
    // 等 iframe 加载完成后同步参数
    frame.onload = function() { syncFrame(); };
    applyPreview();
  }
  function simWidth(mode) {
    document.getElementById('sim-window').classList.toggle('narrow', mode === 'narrow');
    document.getElementById('sim-width-wide').classList.toggle('on', mode === 'wide');
    document.getElementById('sim-width-narrow').classList.toggle('on', mode === 'narrow');
  }
  function simSidebar(mode) {
    postToFrame({ type: 'dshskin:sidebar', mode: mode });
    document.getElementById('sim-side-expand').classList.toggle('on', mode === 'expand');
    document.getElementById('sim-side-collapse').classList.toggle('on', mode === 'collapse');
  }
  function simAppearance(mode) {
    simAppearanceMode = mode;
    postToFrame({ type: 'dshskin:appearance', appearance: mode });
    document.getElementById('sim-app-light').classList.toggle('on', mode === 'light');
    document.getElementById('sim-app-dark').classList.toggle('on', mode === 'dark');
    applyPreview();
  }
  function syncFrame() {
    if (!themeId) return;
    postToFrame({ type: 'dshskin:appearance', appearance: simAppearanceMode });
  }

  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  load();
</script>
</body>
