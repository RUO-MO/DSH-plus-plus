name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:

# 测试脚本与控制台输出含中文。windows-latest runner 的默认控制台编码是
# cp1252（西文），会让任何中文 print 抛 UnicodeEncodeError 并被误报为测试失败。
# 这里统一强制 UTF-8；tests/run_all.py 亦会为子进程再设一次（双保险）。
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  unit-tests:
    # DSHSkin 面向 Windows 桌面版（CDP/注册表/Electron），在 Windows 上验证
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install websocket-client zstandard PyYAML Pillow

      - name: Run unit tests
        run: python tests/run_all.py
